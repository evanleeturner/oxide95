# The DirectDraw stand-in: the object, the surfaces and the palette a program
# reaches through tables, onto `draw`'s buffers, palette and back. The surfaces
# are every target's; the tables are the shape a program's calls expect. It
# builds for any target, the browser's included.
[package]
name = "draw-surfaces"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The surfaces and the tables, `surfaces::Surfaces` and `com::Com`: they
# allocate, so they stay off where no allocator is, as `draw`'s.
desk = ["draw/desk", "window/desk"]
# The page's back, as `draw`'s.
page = ["desk", "draw/page"]

[dependencies]
draw = { path = "../draw" }
window = { path = "../window" }
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
draw = { path = "../draw", features = ["page"] }
window = { path = "../window", features = ["desk", "page"] }
oxide_logline = { path = "../oxide-logline" }
