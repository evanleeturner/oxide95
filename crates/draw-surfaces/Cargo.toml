# The DirectDraw stand-in: the object, the surfaces and the palette a program
# reaches through tables, onto `draw`'s buffers, palette and back. The surfaces
# are every target's; the tables are the shape a program's calls expect. It
# builds for any target, the browser's included.
[package]
name = "draw-surfaces"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The surfaces and the tables, `surfaces::Surfaces` and `com::Com`: they
# allocate, so they stay off where no allocator is, as `draw`'s.
desk = ["draw/desk", "window/desk"]
# The page's back, as `draw`'s.
page = ["desk", "draw/page"]
# A host's back and the Win32 target's, as `draw`'s: for the worked script's
# programs below, which no game's build takes.
native = ["desk", "draw/native", "window/native"]
user32 = ["desk", "draw/user32", "window/user32"]

# The worked script in a browser: `cargo build --example surfaces_page --features page
# --target wasm32-unknown-unknown --release`. Its file lies with the script, under `page/`.
[[example]]
name = "surfaces_page"
path = "page/surfaces.rs"
crate-type = ["cdylib"]
required-features = ["page"]

# The worked script on a host's window: run under a time limit.
[[example]]
name = "surfaces_native"
path = "bench/surfaces_native.rs"
required-features = ["native"]

# The worked script on a real Wine window, built for `i686-pc-windows-gnu`.
[[example]]
name = "surfaces_wine"
path = "bench/surfaces_wine.rs"
required-features = ["user32"]

# Every slot of the three tables, called by offset with `esp` read on each side: built
# for `i686-pc-windows-gnu`, as a stack of this shape is a 32-bit target's alone.
[[example]]
name = "surfaces_stack"
path = "bench/surfaces_stack.rs"
required-features = ["user32"]

[dependencies]
draw = { path = "../draw" }
window = { path = "../window" }
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
draw = { path = "../draw", features = ["page"] }
window = { path = "../window", features = ["desk", "page"] }
window-input = { path = "../window-input", features = ["desk"] }
oxide_logline = { path = "../oxide-logline" }
