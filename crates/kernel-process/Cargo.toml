# The Kernel's process: the start-up's
# answers from the game's row, the stand-in's own name table, the last error
# and the end, behind one seam. No target's own names: it builds for any
# target, the browser's included.
[package]
name = "kernel_process"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# A planted file for a test or a page's walk: it allocates.
plant = []
# The host back, `host::Host`: Linux, macOS and Windows through `std` alone.
std = []

# The thin export the page's check runs: `cargo build -p kernel_process --example page_process
# --target wasm32-unknown-unknown`. Its file lies with the script, under `page/`.
[[example]]
name = "page_process"
path = "page/process.rs"
crate-type = ["cdylib"]

[dependencies]
kernel_last_error = { path = "../kernel-last-error" }
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
# The checks under tests/ read the host back and the planted file: a feature cannot be turned on
# for one integration test, and `required-features` would skip them silently.
kernel_process = { path = ".", features = ["plant", "std"] }
# The last error's test reads each crate that keeps one, beside this crate's own.
kernel_files = { path = "../kernel-files", features = ["memory"] }
kernel_text = { path = "../kernel-text" }
kernel_threads = { path = "../kernel-threads", features = ["std", "page"] }
kernel_time = { path = "../kernel-time", features = ["std"] }
logical_disc = { path = "../logical-disc", features = ["disc"] }
