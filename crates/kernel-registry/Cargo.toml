# The Kernel's registry: the ADVAPI32 names a program
# asks of its saved settings, behind one seam. No host registry call and no
# target's own names: it builds for any target, the browser's included.
[package]
name = "kernel_registry"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The page back, `page::Page`: the settings tree in memory, its save handed
# in. It allocates, so it stays off where no allocator is: the swap under Wine
# is `no_std` with none, and links `kernel_registry` through a game's rows crate.
page = []
# The file back, `file::SettingsFile`: the tree in one text file in the host's
# settings folder, through `std` alone.
std = ["page"]

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
