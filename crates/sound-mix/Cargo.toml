# The mixer a program's sound calls answer from, needing no device: voices move
# by the clock, each call answered and logged here. It names no game, and needs
# an allocator but nothing of any one target, so it builds for the browser too;
# one back, over Windows' winmm, is compiled on Windows alone.
[package]
name = "sound-mix"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The ring a browser page's script reads. It needs nothing the rest does not.
page = []

# The thin export the page's proof runs: `cargo build --example page_tone --features page
# --target wasm32-unknown-unknown`. Its file lies with the script, under `page/`.
[[example]]
name = "page_tone"
path = "page/tone.rs"
crate-type = ["cdylib"]
required-features = ["page"]

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
