# The DirectSound stand-in: the object and the buffers a program reaches through
# tables, onto `sound-mix`'s doors. The buffers move by a clock the host reads and
# need no device and no thread of their own, so it builds for any target, the
# browser's included.
[package]
name = "sound-buffers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
sound-mix = { path = "../sound-mix" }
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
