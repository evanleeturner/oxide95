# The logline adapter: a `log` sink rendering the workspace's line grammar
# (a two-line header, then `HH:MM:SS.mmm L event k=v`), installed only by
# tests and binaries; and the fence holding `logbook.json` to the call sites.
[package]
name = "oxide_logline"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The logbook fence, for a workspace's tests: it reads JSON.
fence = ["dep:serde_json"]

[dependencies]
log = { version = "0.4", features = ["kv", "std"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
oxide_logline = { path = ".", features = ["fence"] }
