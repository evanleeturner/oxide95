# A program for the 32-bit Windows target, run under Wine: it asks the real USER32 through
# `window::user32` and `window_input::user32` and, beside each, through a call declared by
# hand, so a wrong answer can say which of the two gave it. A workspace of its own, as it
# builds for that one target alone, by `../user32_check.sh`.
[package]
name = "user32_check"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
window = { path = "../../../window", features = ["user32"] }
window-input = { path = "../../../window-input", features = ["user32"] }
log = { version = "0.4", features = ["kv"] }

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
