# The DEBUG trace's instrument: the macros each port's sites are wrapped in,
# each evaluating its wrapped expression once and logging the values that
# moved at DEBUG, through the `log` facade. No sink is installed here.
[package]
name = "oxide_trace"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(oxide_trace_strict)"] }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
log = { version = "0.4", features = ["kv"] }
