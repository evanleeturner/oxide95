# The video stand-in: the 8 names a program asks of RAD's Smacker library, over
# `video_smacker`'s decoder, each back a trait, the sound's real one `sound-mix`.
# It names no game and no target, so it builds for any target, the browser's
# included.
[package]
name = "video"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
sound-mix = { path = "../sound-mix" }
video_smacker = { path = "../video-smacker" }
log = { version = "0.4", features = ["kv"] }

[dev-dependencies]
draw = { path = "../draw", features = ["page"] }
oxide_logline = { path = "../oxide-logline" }

# One clip on the host's own clock, timed from outside by `bench/pace_and_door.py`.
[[example]]
name = "pace_and_door"
path = "bench/pace_and_door.rs"

# A clip in a browser's wasm, for a script outside the page to judge: `cargo build --example
# clip_page --target wasm32-unknown-unknown --release`. Empty on any other target.
[[example]]
name = "clip_page"
path = "page/clip_page.rs"
crate-type = ["cdylib"]
