# The calls a program makes to a joystick, answered from a row. No target's own
# names and no allocator: it builds for any target, the browser's included.
[package]
name = "joystick"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# Real pads through the `gilrs` library, on Linux and macOS; elsewhere it adds nothing.
gilrs = ["dep:gilrs"]
# Builds `winmm_probe`, a Windows target's alone; it adds no dependency.
winmm-probe = []

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
gilrs = { version = "=0.11.2", optional = true }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }

# Wine's own `winmm` beside the crate's answers, built for `i686-pc-windows-gnu`.
[[example]]
name = "winmm_probe"
path = "bench/winmm_probe.rs"
required-features = ["winmm-probe"]

# The page's words through `PagePads`, read back as a program reads them.
[[example]]
name = "page_pads"
path = "bench/page_pads.rs"
