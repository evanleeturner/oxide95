# Checks of `oxide_trace`'s macros, in a crate of their own because `oxide_trace`
# forbids `unsafe` and a raw read of memory needs it. Each macro is judged by a table
# worked by hand, by the logbook and by a counter of real touches of a page. It runs on
# Linux `x86_64` and Windows `x86`, and is empty anywhere else. Nothing here ships.
[package]
name = "oxide_trace_check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
log = { version = "0.4", features = ["kv"] }
oxide_trace = { path = "../oxide-trace" }
serde_json = "1"
