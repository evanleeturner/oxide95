# The calls a program makes to find its CD-audio disc, answered from a row: no
# disc read, no sound. No target's own names and no allocator: it builds for
# any target, the browser's included.
[package]
name = "cd-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# A disc's tracks counted from `logical_disc`; needs an allocator.
disc = ["dep:logical_disc", "logical_disc/disc"]
# A disc's sound through `sound-mix`'s door. Never in the browser's graph.
door = ["disc", "dep:sound-mix"]

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }
logical_disc = { path = "../logical-disc", optional = true }
sound-mix = { path = "../sound-mix", optional = true }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
logical_disc = { path = "../logical-disc", features = ["disc"] }
sound-mix = { path = "../sound-mix" }
kernel_files = { path = "../kernel-files" }
