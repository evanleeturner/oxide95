# The calls a program makes to its CD-audio disc, answered from a row, and a
# disc's tracks played from a clock. With no feature: no disc read, no target's
# own names and no allocator, so it builds for any target, the browser's included.
[package]
name = "cd-audio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# A disc's tracks counted from `logical_disc`; needs an allocator.
disc = ["dep:logical_disc", "logical_disc/disc"]
# A disc's sound through `sound-mix`'s door. Never in the browser's graph.
door = ["disc", "dep:sound-mix"]
# A store's Ogg tracks through the door. Not in the browser, which plays the file itself.
ogg = ["door", "dep:kernel_files", "dep:lewton"]
# A disc's sound through `sound-mix`'s back over cpal, on Linux and macOS, for the bench's
# route. On Linux it needs ALSA's headers to build.
native = ["door", "sound-mix/native"]

# The made disc's logic on a held clock: `cargo test -p cd-audio --features door,ogg`.
[[test]]
name = "made_track"
required-features = ["door", "ogg"]

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }
logical_disc = { path = "../logical-disc", optional = true }
sound-mix = { path = "../sound-mix", optional = true }
kernel_files = { path = "../kernel-files", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lewton = { version = "=0.10.2", optional = true }

[dev-dependencies]
oxide_logline = { path = "../oxide-logline" }
logical_disc = { path = "../logical-disc", features = ["disc"] }
sound-mix = { path = "../sound-mix" }
kernel_files = { path = "../kernel-files" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
lewton = "=0.10.2"
