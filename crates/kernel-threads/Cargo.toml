# The Kernel's threads: a lock, a slot a thread,
# a counter and a thread's number behind one seam, `Threads`. No target's own
# names in the fronts: it builds for any target, the browser's included.
[package]
name = "kernel_threads"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unsafe_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -2 }
correctness = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"

[features]
# The host back, `host::Host`: Linux, macOS and Windows through `std`.
std = []
# The page back, `page::Page`: the browser's one thread. It allocates its slot
# table, so it stays off where no allocator is: the swap under Wine is `no_std`
# with none, and links `kernel_threads` through a game's rows crate.
page = []

# The thin export the page's check runs: `cargo build --example page_threads --features page
# --target wasm32-unknown-unknown`. Its file lies with the script, under `page/`.
[[example]]
name = "page_threads"
path = "page/threads.rs"
crate-type = ["cdylib"]
required-features = ["page"]

[dependencies]
oxide_trace = { path = "../oxide-trace" }
log = { version = "0.4", features = ["kv"] }
